# Local Postgres for developing and testing the Closeline database base.
#   docker compose up -d        (set POSTGRES_PORT if 5432 is taken, e.g. POSTGRES_PORT=5433)
#   docker compose down -v      (also drops the data, so docker/postgres/init.* runs again)
# One Postgres per Region (ADR 0007). The passwords below are LOCAL DEVELOPMENT ONLY: real
# environments create the roles in tula-closeline-infra with secrets from the secret store.
# The port binds to 127.0.0.1 only, because Docker bypasses host firewalls.
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      # The bootstrap superuser. Nothing but the init script connects as it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
      POSTGRES_DB: closeline
      # LOCAL ONLY. Read by docker/postgres/init.sh, which hands them to init.sql.
      CLOSELINE_OWNER_PASSWORD: ${CLOSELINE_OWNER_PASSWORD:-closeline_owner_local}
      CLOSELINE_AUTH_PASSWORD: ${CLOSELINE_AUTH_PASSWORD:-closeline_auth_local}
      CLOSELINE_CORE_PASSWORD: ${CLOSELINE_CORE_PASSWORD:-closeline_core_local}
      CLOSELINE_PLAYBOOK_PASSWORD: ${CLOSELINE_PLAYBOOK_PASSWORD:-closeline_playbook_local}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./docker/postgres/init.sql:/etc/closeline/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d closeline']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
